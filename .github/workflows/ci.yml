# CI (docs/roadmap.md P0 #5). build/lib is gitignored (artifacts are built
# at `npm pack` time via prepack, never committed), so the emsdk jobs start
# by building the WASM module from the C sources with a pinned emsdk --
# which also means every run verifies sources and JS wrapper agree. Three
# suites:
#   native:  the C layer compiled by a plain cc under ASan+UBSan, with no
#            emscripten, no WASM and no JavaScript -- plus the structures'
#            hostile-file fuzz harness. Runs first because it needs no
#            toolchain setup and finishes in seconds, so a C-level break is
#            reported long before the emsdk jobs have finished installing.
#            It is also the only job that can catch a memory error at all:
#            the JS suites drive the same C, but a use-after-free there is
#            invisible.
#   wasi:    the same C harness cross-compiled to wasm32-wasip1 and run
#            under TWO WASI hosts -- Node's, and wasmtime -- at the
#            versions this repo pins (build/build-common.sh, fetched by
#            build/get-wasi-sdk.sh and build/get-wasmtime.sh, the same
#            commands a developer runs, which is the point: this job used
#            to be the only place the target could run at all). Two hosts
#            because preview1 is rights-based and they do not agree on
#            what a preopened directory carries; the first run under a
#            second host found a durability bug in the POSIX adapter that
#            Node's had been passing over. Not redundant with `native`:
#            wasm32
#            has 32-bit pointers and a 1 MB stack where the native job has
#            64-bit pointers and 8 MB, so this is the only job whose memory
#            model resembles the one the library actually SHIPS on. It
#            found a regex VM stack frame larger than the entire browser
#            stack on its first run -- a corruption the native and node
#            suites had both been passing over for as long as it existed.
#   node:    the full node suite, including the real OPFS code paths
#            (node-opfs shims navigator.storage in Node).
#   browser: the *.browser.test.js suite under Playwright Chromium -- real
#            Workers, real OPFS sync access handles, real navigator.locks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a branch can be checked before it is merged or opened as a PR --
  # `gh workflow run CI --ref <branch>`. Changes to this file are the
  # obvious case: they cannot be tested anywhere but on a runner.
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # test/native/ drives engine/include/db.h's dc_* API directly. No npm
      # install, no emsdk -- if this needs either, something has leaked
      # back across the boundary this job exists to defend.
      - name: C harness (ASan + UBSan)
        run: ./build/build-native.sh
      - name: Structures fuzz (ASan + UBSan)
        run: ./build/build-native.sh --fuzz 20000

  wasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # node:wasi only -- no npm install. build/run-wasi.mjs imports nothing
      # but Node builtins, so this job stays as dependency-free as `native`
      # and for the same reason: it defends a boundary that npm is on the
      # wrong side of.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Pinned like emsdk is. A toolchain bump that changes codegen should
      # arrive as a commit, not as a Tuesday -- and the pin itself lives
      # in build/build-common.sh, which this script reads, so a bump is one
      # edit and this job cannot end up on a different toolchain from the
      # one a developer runs. That is the whole reason CI calls the script
      # instead of keeping its own copy of the URL.
      #
      # /opt/wasi-sdk rather than the script's default (beside the
      # checkout) because it is on build-native.sh's search path, so the
      # two steps below need no environment at all -- they are exactly
      # what a developer types.
      - name: Install wasi-sdk (pinned)
        run: ./build/get-wasi-sdk.sh --dir /opt/wasi-sdk
      # The second WASI host, pinned and fetched the same way. Node's host
      # and wasmtime disagree about what rights a preopened directory
      # carries, and the two steps below run under BOTH -- which is how
      # that class of difference gets caught rather than shipped. Also on
      # build-native.sh's search path, so again: no environment.
      - name: Install wasmtime (pinned)
        run: ./build/get-wasmtime.sh --dir /opt/wasmtime
      - name: C harness on wasm32-wasip1
        run: ./build/build-native.sh --wasi
      - name: Structures fuzz on wasm32-wasip1
        run: ./build/build-native.sh --wasi --fuzz 20000
      # The server, on all three targets it can be built for. Building it
      # here is most of the value: one main() over one engine, and a
      # target that stops compiling is a boundary that has moved.
      # test/db.server.test.js drives the artifacts in the `node` job.
      - name: Server binaries (native, wasip1, wasip2)
        run: |
          ./build/build-server.sh --native
          ./build/build-server.sh --wasip1
          ./build/build-server.sh --wasip2

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # 24, not 22: navigator.locks arrived in Node v24.5.0 and
      # src/db-coordinator.js refuses to run without it, so the whole of
      # db-coordinator.test.js -- election, RPC, handover, cross-tab
      # watch() -- fails on 22 with "run it inside a Worker". `cache: npm`
      # needs the lockfile, which is committed now; see .gitignore.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v16
        with:
          # Keep in lockstep with build/build-wasm.sh's header comment.
          version: 5.0.7
      - run: npm ci
      - run: ./build/build-wasm.sh
      # test/db.server.test.js skips unless these exist, and skipping
      # quietly is how a suite stops covering the thing it names. The
      # native build needs no toolchain beyond cc; wasip2 and wasmtime
      # are what let it drive the deployment target over a real socket.
      - name: Install wasi-sdk and wasmtime (pinned)
        run: |
          ./build/get-wasi-sdk.sh --dir /opt/wasi-sdk
          ./build/get-wasmtime.sh --dir /opt/wasmtime
      - name: Build the server (native + wasip2)
        run: |
          ./build/build-server.sh --native
          ./build/build-server.sh --wasip2
      # NISABA_SERVER_TESTS=required: everything above exists in this job,
      # so a server suite that SKIPS here is a broken job reporting green.
      # It asserts the artifacts and wasmtime are there and fails if they
      # are not; a developer who has not built the server still just sees
      # them skip. The client and the CLI then run twice over, against the
      # native binary and against the wasip2 command under wasmtime --
      # the deployment target, driven by the shipped client rather than
      # by a test's own protocol code.
      - run: PATH="/opt/wasmtime:$PATH" NISABA_SERVER_TESTS=required npm test
      # The bench is informational -- its NUMBERS gate nothing, and a
      # 50-op run says nothing about performance. What this step gates
      # is that the bench still RUNS: it is the one entry point no test
      # imports, so it is the one that rots silently when an API
      # contract moves (it sat broken for three weeks when ready()
      # became the caller's to await). Both providers, because they are
      # different code paths into the same engine.
      - name: Bench smoke (runs, not measures)
        run: |
          node test/bench.js --n 50
          node test/bench.js --n 50 --provider node

  # The SERVER under a sanitizer, which nothing did until this job.
  # build-native.sh sanitizes the engine but links only server/root.c, so
  # every line of the poll loop, the Raft host and the peer transport --
  # main.c, replica.c, peers.c, join.c, instns.c -- was compiled by no
  # sanitized build anywhere. The suite that drives them hardest is the
  # one already in this repository, so this job simply points it at a
  # sanitized binary and then leans on it with the concurrency soak.
  #
  # Its own job rather than a step in `node`: an ASan build is 2-3x
  # slower, so this runs in parallel instead of doubling that job, and a
  # failure here names the sanitizer rather than "npm test".
  server-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the server with ASan + UBSan
        run: ./build/build-server.sh --native --san
      # Only the suites that drive the binary. The rest of `npm test` is
      # the WASM engine in this process, which the `node` job already
      # covers and a server sanitizer says nothing about.
      - name: The server suites, against the sanitized binary
        env:
          NISABA_SERVER_BIN: build/lib/nisaba-server-asan
        run: |
          npx vitest run test/db.concurrency.test.js test/db.server.test.js \
                        test/db.http-front.test.js test/db.http-client.test.js
      # Randomized, seeded, and it asserts CONTENT: a file closed under a
      # reader means a pread on a recycled descriptor, which returns
      # another file's bytes with no error at all. A run that only
      # watched for crashes would pass straight through that.
      - name: Soak (readers + writer + compaction, drops, index churn)
        env:
          NISABA_SERVER_BIN: build/lib/nisaba-server-asan
        run: node test/soak.js --seconds 90 --readers 8 --seed 1

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.7
      - run: npm ci
      - run: ./build/build-wasm.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
